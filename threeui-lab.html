<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ThreeUI Visual Lab | Shaunak Rane</title>
  <meta name="description" content="Cinematic 3D visual experimentation lab exploring the spatial identity of engineering projects.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/threeui-lab.css">
  <script type="importmap">
  {
    "imports": {
      "three": "./assets/vendor/three.module.min.js",
      "three/addons/": "./assets/vendor/addons/"
    }
  }
  </script>
</head>
<body>
  <canvas id="lab-canvas"></canvas>

  <!-- Minimal Lab Chrome: Only Prototype Switcher & Visual Controls -->
  <header class="lab-chrome">
    <nav class="prototype-tabs" aria-label="Prototype Switcher">
      <button class="tab-item is-active" data-prototype-tab="0">AEGIS</button>
      <button class="tab-item" data-prototype-tab="1">GRIDIUM</button>
      <button class="tab-item" data-prototype-tab="2">COMPRESSOR</button>
      <button class="tab-item" data-prototype-tab="3">KRUSHIMITRA</button>
      <button class="tab-item" data-prototype-tab="4">FOOD OPS</button>
    </nav>

    <div class="lab-controls">
      <button id="bloom-toggle" class="ctrl-btn is-active" title="Toggle Bloom">BLOOM: ON</button>
      <div class="ctrl-slider-group">
        <label for="bloom-slider">GLOW</label>
        <input id="bloom-slider" type="range" min="0.2" max="2.5" step="0.05" value="1.2">
      </div>
      <div class="ctrl-slider-group">
        <label for="speed-slider">SPEED</label>
        <input id="speed-slider" type="range" min="0.2" max="2.5" step="0.1" value="1.0">
      </div>
      <button id="reset-cam" class="ctrl-btn" title="Reset Camera">RESET CAM</button>
      <a href="index.html" class="portfolio-return">← PORTFOLIO</a>
    </div>
  </header>

  <script type="module" src="js/threeui/lab-controller.js"></script>
</body>
</html>
